name: Release validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Verify the documented training command works from a clean checkout
        run: python ai/train_flood_model.py --artifact "$RUNNER_TEMP/model.json"

      - name: Run backend tests
        env:
          PYTHONPATH: backend
        run: python -m pytest tests -q

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Type-check and build frontend
        working-directory: frontend
        run: npm ci && npm run build

      - name: Build Docker services
        run: docker compose build
